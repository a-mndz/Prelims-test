name: Lockfile refresh

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile
        working-directory: .
        run: npm install --package-lock-only
      - name: Open PR if lockfile changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already up to date"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/lockfile-refresh
          git add package-lock.json
          git commit -m "chore: create package-lock.json"
          git push -f origin chore/lockfile-refresh
          if gh pr view chore/lockfile-refresh --json state >/dev/null 2>&1; then
            echo "PR already open"
          else
            gh pr create --title "chore: add package-lock.json" --body "Automated: creates a package-lock.json for the root manifest so installed dependency versions are pinned and reproducible." --base main --head chore/lockfile-refresh
          fi
